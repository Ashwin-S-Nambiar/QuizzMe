<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">QuizzMe!</title>
  <desc id="d">QuizzMe!, settle a bet or start one. The stickers from the landing page float on the right: a lilac question mark, a five in a row streak, a correct chip, a hard chip, and a card asking the capital of Australia with Sydney marked wrong and Canberra marked right.</desc>

  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#121210" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="379" rx="20" fill="#fafaf9" stroke="rgba(18,18,16,0.10)"/>

  <g id="title-block" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="64" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" letter-spacing="1.9" fill="#706e69">TRIVIA, 24 TOPICS</text>
    <text x="64" y="170" font-size="60" font-weight="700" letter-spacing="-1.8" fill="#121210">QuizzMe<tspan fill="#3e4eb3">!</tspan></text>
    <text x="64" y="216" font-size="20" fill="#121210">settle a bet. <tspan fill="#3e4eb3">or start one.</tspan> questions come</text>
    <text x="64" y="244" font-size="20" fill="#121210">straight from open trivia db, so nobody knows</text>
    <text x="64" y="272" font-size="20" fill="#121210">what's next. not even me.</text>
    <text x="64" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#706e69">react 19<tspan fill="rgba(18,18,16,0.22)">  /  </tspan>open trivia db<tspan fill="rgba(18,18,16,0.22)">  /  </tspan>web audio<tspan fill="rgba(18,18,16,0.22)">  /  </tspan>no backend</text>
  </g>

  <g id="stickers" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <!-- question mark -->
    <g filter="url(#lift)">
      <circle cx="712" cy="118" r="44" fill="#e9defc"/>
      <text x="712" y="137" font-size="54" font-weight="800" fill="#5a3983" text-anchor="middle">?</text>
    </g>

    <!-- streak -->
    <g transform="rotate(4 862 98)" filter="url(#lift)">
      <rect x="788" y="76" width="148" height="44" rx="22" fill="#ffefaf"/>
      <path d="M816 88c5 5 8 9 8 13a8 8 0 0 1-16 0c0-3 2-5 3-7 1 3 2 4 4 4-1-3 0-7 1-10z" fill="#64470e"/>
      <text x="834" y="105" font-size="19" font-weight="500" fill="#64470e">5 in a row</text>
    </g>

    <!-- correct -->
    <g transform="rotate(-5 862 164)" filter="url(#lift)">
      <rect x="796" y="142" width="134" height="44" rx="22" fill="#d6f0dd"/>
      <path d="M816 165l6 6 11-12" fill="none" stroke="#1e5433" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="842" y="171" font-size="19" font-weight="500" fill="#1e5433">Correct</text>
    </g>

    <!-- question card -->
    <g transform="rotate(2.5 960 250)" filter="url(#lift)">
      <rect x="840" y="210" width="260" height="92" rx="14" fill="#ffffff" stroke="rgba(18,18,16,0.08)"/>
      <text x="860" y="242" font-size="18" font-weight="600" fill="#121210">Capital of Australia?</text>
      <rect x="860" y="258" width="76" height="28" rx="9" fill="#ffe6e3"/>
      <text x="898" y="277" font-size="14" font-weight="500" fill="#9e2225" text-anchor="middle">Sydney</text>
      <rect x="944" y="258" width="90" height="28" rx="9" fill="#d6f0dd"/>
      <text x="989" y="277" font-size="14" font-weight="500" fill="#1e5433" text-anchor="middle">Canberra</text>
    </g>

    <!-- hard -->
    <g transform="rotate(-7 1078 138)" filter="url(#lift)">
      <rect x="1036" y="116" width="84" height="42" rx="21" fill="#fae0d3"/>
      <text x="1078" y="143" font-size="19" font-weight="500" fill="#884117" text-anchor="middle">Hard</text>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#706e69" text-anchor="middle">
      <text x="906" y="340">1 request / 5 s, queued, never dropped</text>
    </g>
  </g>
</svg>
